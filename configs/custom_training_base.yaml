# Internal production base used by the desktop 100+30 product-task workflow.
# The UI replaces data_root, category, run name and output root after strict
# support-set validation. Do not run this base file directly.
dataset: custom
data_root: .
categories: [product]

protocol:
  normal_support: 100
  defect_support: 30
  minimum_holdout_per_category: 0
  minimum_pooled_test: 0

run_name: custom_product
candidate_id: AOI-CUSTOM-PRODUCT
device: auto
seed: 20260808

source_assets:
  resnet18_weights: assets/resnet18-f37072fd.pth
  dinov2_repository: assets/dinov2
  dinov2_weights: assets/dinov2_vits14_pretrain.pth
  source_model: assets/source_model.pt

head:
  epochs: 60
  learning_rate: 0.01

output_root: outputs/custom_tasks
