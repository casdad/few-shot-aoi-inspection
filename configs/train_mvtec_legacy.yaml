# Explicit legacy MVTec workflow. The default train.yaml now selects DAGM2007.
dataset: mvtec_ad
data_root: data/mvtec_ad
categories: auto

protocol:
  normal_support: 100
  defect_support: 30
  minimum_holdout_per_category: 1
  minimum_pooled_test: 1000

run_name: mvtec
candidate_id: AOI-MVTEC

device: auto
seed: 20260808

source_assets:
  resnet18_weights: assets/resnet18-f37072fd.pth
  dinov2_repository: assets/dinov2
  dinov2_weights: assets/dinov2_vits14_pretrain.pth
  source_model: assets/source_model.pt

head:
  epochs: 60
  learning_rate: 0.01

output_root: outputs/mvtec_legacy_new_runs
